name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test:
    name: Backend — install, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Tests use mongodb-memory-server — no external database required.
      # The test setup file sets NODE_ENV=test and JWT_SECRET automatically.
      - name: Run backend test suite
        working-directory: backend
        run: npm test

  frontend-build:
    name: Frontend — install, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # VITE_API_URL is set to a placeholder — the build should succeed without
      # a real backend URL. Real values are injected at deployment time.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_STRIPE_PUBLISHABLE_KEY: ""
        run: npm run build
